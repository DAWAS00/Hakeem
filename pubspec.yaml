name: hakeem
description: "حكيم — طبيبك الرقمي الذكي"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter

  # UI
  cupertino_icons: ^1.0.8
  google_fonts: any
  flutter_animate: any
  flutter_svg: ^2.3.0
  path_drawing: ^1.0.1
  gap: any

  # State & Navigation
  flutter_riverpod: any
  riverpod_annotation: any
  go_router: any

  # Backend
  supabase_flutter: ^2.15.4

  # Functional error handling
  fpdart: ^1.2.0

  # Logging / telemetry
  talker_flutter: ^5.1.17
  talker_riverpod_logger: ^5.1.17

  # Storage
  shared_preferences: any

  # Auth
  local_auth: any

  # Connectivity
  connectivity_plus: any

  # OTP input (signup phone verification)
  pinput: ^6.0.2

  # Forms
  flutter_form_builder: any

  # Charts & Calendar
  fl_chart: any
  table_calendar: any

  # Code gen
  freezed_annotation: any
  json_annotation: any

  # i18n
  intl: any
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  hugeicons: ^1.1.7

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any
  riverpod_generator: ^4.0.0
  build_runner: any
  freezed: any
  json_serializable: any
  riverpod_lint: any
  custom_lint: any
  flutter_launcher_icons: ^0.14.1

flutter_launcher_icons:
  image_path: "assets/hakeem/hakeem_app_icon/icon_1024.png"
  android: "ic_launcher"
  ios: true
  remove_alpha_ios: true

  # Android adaptive icon (API 26+ — gradient bg + wordmark fg + monochrome)
  adaptive_icon_background: "assets/hakeem/hakeem_app_icon/android/adaptive_background.png"
  adaptive_icon_foreground: "assets/hakeem/hakeem_app_icon/android/adaptive_foreground.png"
  adaptive_icon_monochrome: "assets/hakeem/hakeem_app_icon/android/monochrome_foreground.png"

  # Web favicons
  web:
    generate: true
    image_path: "assets/hakeem/hakeem_app_icon/icon_1024.png"
    background_color: "#013F73"
    theme_color: "#00538F"

flutter:
  generate: true
  uses-material-design: true

  assets:
    - assets/hakeem/heritage/
    - svg/huge/
    - svg/material/
    - flutter_icons/
    - flutter_icons/static/
    - flutter_icons/animated/
